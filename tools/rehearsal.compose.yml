# Synthetic rehearsal only. Never merge this with the normal Compose file.
services:
  rehearsal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinic_rehearsal
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: synthetic-rehearsal-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d clinic_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [rehearsal]
  web:
    build:
      context: ..
    command: ["python", "tools/rehearse_multiclinic.py", "verify"]
    volumes:
      - ../:/app:ro
    environment:
      CLINIC_REHEARSAL: "synthetic-only"
      DJANGO_SETTINGS_MODULE: dental_clinic.settings_pytest
      DEBUG: "True"
      SECRET_KEY: synthetic-rehearsal-key-not-for-real-deployments
      DATABASE_URL: ""
      DB_SECRET_ARN: ""
      DB_HOST: rehearsal-db
      DB_PORT: "5432"
      DB_NAME: clinic_rehearsal
      DB_USER: rehearsal
      DB_PASSWORD: synthetic-rehearsal-only
      ENABLE_SILK: "False"
      XRAY_CLOUD_UPLOAD_ENABLED: "False"
      CLOUDINARY_URL: ""
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      rehearsal-db:
        condition: service_healthy
    networks: [rehearsal]
networks:
  rehearsal:
    internal: true
