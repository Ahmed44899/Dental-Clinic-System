services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: .
    command: ./entrypoint.sh
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose is a local stack. Blank any hosted DATABASE_URL from .env so
      # commands can never migrate or modify the online database accidentally.
      DATABASE_URL: ""
      DB_SECRET_ARN: ""
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      XRAY_CLOUD_UPLOAD_ENABLED: "False"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
